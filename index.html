:root {
  --bg: #07060f;
  --surface: #121026;
  --surface-2: #1a1738;
  --line: rgba(255, 255, 255, 0.10);
  --text: #f8fafc;
  --muted: #a5a3c7;
  --neon: #00ff9d;
  --violet: #a855f7;
  --violet-soft: #c084fc;
  --cyan: #38bdf8;
  --amber: #fbbf24;
  --danger: #ff4d7d;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #07060f;
    --surface: #121026;
    --surface-2: #1a1738;
    --text: #f8fafc;
    --muted: #a5a3c7;
  }
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  overflow-x: clip;
}

.font-display {
  font-family: 'Orbitron', 'Space Grotesk', sans-serif;
}

.neon-text {
  color: var(--neon);
  text-shadow: 0 0 18px rgba(0, 255, 157, .65), 0 0 42px rgba(0, 255, 157, .22);
}

.violet-text {
  color: var(--violet-soft);
  text-shadow: 0 0 18px rgba(168, 85, 247, .55);
}

.hero-grid {
  background-image: linear-gradient(rgba(0,255,157,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(168,85,247,.055) 1px, transparent 1px);
  background-size: 42px 42px;
  -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 100%);
          mask-image: linear-gradient(to bottom, black 55%, transparent 100%);
}

.glow-green {
  box-shadow: 0 0 0 1px rgba(0,255,157,.25), 0 18px 55px rgba(0,255,157,.14);
}

.glow-violet {
  box-shadow: 0 0 0 1px rgba(168,85,247,.28), 0 18px 55px rgba(168,85,247,.16);
}

.card-hover {
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.card-hover:hover {
  transform: translateY(-5px);
  border-color: rgba(0,255,157,.45);
  box-shadow: 0 18px 42px rgba(0,0,0,.45), 0 0 28px rgba(0,255,157,.10);
}

@keyframes floaty {
  0%,100% {
    transform: translateY(0)
  }

  50% {
    transform: translateY(-9px)
  }
}

@keyframes pulseDot {
  0%,100% {
    opacity: 1;
    transform: scale(1)
  }

  50% {
    opacity: .45;
    transform: scale(.78)
  }
}

@keyframes marquee {
  from {
    transform: translateX(0)
  }

  to {
    transform: translateX(-50%)
  }
}

.animate-floaty {
  animation: floaty 4s ease-in-out infinite;
}

.live-dot {
  animation: pulseDot 1.5s ease-in-out infinite;
}

.marquee-track {
  animation: marquee 24s linear infinite;
}

button, a, input {
  -webkit-tap-highlight-color: transparent;
}

input:focus, button:focus-visible, a:focus-visible {
  outline: 2px solid var(--neon);
  outline-offset: 3px;
}

.memory-card {
  perspective: 700px;
}

.memory-inner {
  transform-style: preserve-3d;
  transition: transform .35s ease;
}

.memory-card.flipped .memory-inner {
  transform: rotateY(180deg);
}

.memory-face {
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

.memory-back {
  transform: rotateY(180deg);
}

::-webkit-scrollbar {
  width: 10px;
  height: 8px;
}

::-webkit-scrollbar-thumb {
  background: #2d2950;
  border-radius: 999px;
}

::-webkit-scrollbar-track {
  background: #0b0920;
}

.hover\:border-\[var\(--neon\)\]:hover{
  border-color: var(--neon);
}

.hover\:bg-white\/20:hover{
  background-color: rgb(255 255 255 / 0.2);
}

.hover\:text-\[var\(--neon\)\]:hover{
  color: var(--neon);
}

.focus\:border-\[var\(--neon\)\]:focus{
  border-color: var(--neon);
}

.disabled\:opacity-40:disabled{
  opacity: 0.4;
}

.disabled\:opacity-50:disabled{
  opacity: 0.5;
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:flex{
    display: flex;
  }

  .sm\:hidden{
    display: none;
  }

  .sm\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .sm\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .sm\:gap-3{
    gap: 0.75rem;
  }

  .sm\:gap-4{
    gap: 1rem;
  }

  .sm\:p-5{
    padding: 1.25rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:p-7{
    padding: 1.75rem;
  }

  .sm\:p-8{
    padding: 2rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-16{
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:pt-20{
    padding-top: 5rem;
  }

  .sm\:text-3xl{
    font-size: 1.875rem;
    line-height: 2.25rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-lg{
    font-size: 1.125rem;
    line-height: 1.75rem;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }

  .sm\:text-xl{
    font-size: 1.25rem;
    line-height: 1.75rem;
  }
}

@media (min-width: 768px){
  .md\:grid-cols-2{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
